[project]
name = "flet-gpumap"
version = "0.1.0"
description = "GPU で格子データ(気象の予報など)を地図に描く Flet の拡張"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "aiseed-dev" }]
keywords = ["flet", "flutter", "gpu", "shader", "map", "weather", "grid"]
license = "MIT"
dependencies = [
    "flet>=1.0.4",
]

[project.urls]
Homepage = "https://github.com/aiseed-dev/aiai-tools/tree/main/packages/flet-gpumap"
Repository = "https://github.com/aiseed-dev/aiai-tools"
Issues = "https://github.com/aiseed-dev/aiai-tools/issues"

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[tool.setuptools.package-data]
"flutter.flet_gpumap" = ["**/*"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
