[package]
name = "nc4rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Python bindings for netcdf-rust: read and write NetCDF-4 and classic files without C"
publish = false

[lib]
name = "_nc4rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
netcdf-core = "0.9.1"
netcdf-reader = "0.9.1"
netcdf-writer = "0.9.1"
ndarray = "0.17"
rayon = "1.12"
# The fast deflate (zlib-rs) for the vendored hdf5-writer and hdf5-reader
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Parallel compression and a faster unshuffle (see vendor/README.md)
[patch.crates-io]
hdf5-writer = { path = "vendor/hdf5-writer" }
hdf5-reader = { path = "vendor/hdf5-reader" }
